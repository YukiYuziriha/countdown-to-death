<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Countdown to Death · UI Prototype</title>
<link rel="stylesheet" href="prototype.css">
<script src="animated-texture.js" defer></script>
<script src="reminder-schedule.js"></script>
</head>
<body>
<canvas id="theme-texture" aria-hidden="true"></canvas>
<div class="shell"><aside class="sidebar"><a class="brand" href="#profiles"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3h12M6 21h12M8 3v4c0 2 2 4 4 5-2 1-4 3-4 5v4m8-18v4c0 2-2 4-4 5 2 1 4 3 4 5v4"/></svg></span><span>Countdown to Death</span></a><nav class="nav" id="nav" aria-label="Main navigation"></nav><div class="themes" id="themes" role="group" aria-label="Color theme"><button type="button" data-theme="neon">Neon</button><button type="button" data-theme="spectral">Spectral</button></div></aside><main id="app"></main></div>
<dialog id="modal" aria-labelledby="dialog-title"></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const icons={plus:'<path d="M12 5v14M5 12h14"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">${icons[n]}</svg>`;
const $=id=>document.getElementById(id);
const esc=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const local=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const future=(days,hour)=>{const d=new Date();d.setDate(d.getDate()+days);d.setHours(hour,0,0,0);return local(d)};
const units=['years','months','weeks','days','hours','minutes','seconds'];
const sizes={weeks:604800,days:86400,hours:3600,minutes:60,seconds:1};
const nf=new Intl.NumberFormat(undefined,{maximumFractionDigits:1});
const timeFmt=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'});
const targetFmt=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'});
const weekdays=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const tagDone=p=>new Date(p.target)<=new Date();
const fresh=()=>({autorun:true,platform:/Android/i.test(navigator.userAgent)?'android':/Linux/i.test(navigator.userAgent)?'linux':'windows',profiles:[
{id:'demo',name:'The long countdown',target:future(482,18),notifyAtTarget:true,format:{units:['years','months','days'],decimal:false},reminders:[{id:'morning',name:'Morning check-in',repeat:'daily',time:'09:00',weekday:'1',day:'1',once:future(1,9),enabled:true,format:{units:['days'],decimal:false}},{id:'weekly',name:'Weekly perspective',repeat:'weekly',time:'09:00',weekday:'1',day:'1',once:future(1,9),enabled:true,format:{units:['months','weeks'],decimal:false}}]},
{id:'trip',name:'Night train to Kyoto',target:future(63,21),format:{units:['weeks','days'],decimal:false},reminders:[]},
{id:'launch',name:'Project launch',target:future(148,12),format:{units:['days','hours'],decimal:false},reminders:[]}]});
const key='countdown-to-death-ui-v1';
let state;try{state=JSON.parse(localStorage.getItem(key))||fresh()}catch{state=fresh()}
const themePanel=document.getElementById('themes');
const setTheme=theme=>{
 state.theme=theme==='spectral'?'spectral':'neon';
 document.documentElement.dataset.theme=state.theme;
 themePanel.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===state.theme)));
};
const persist=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch{}};
const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
const baseFormat=()=>({units:['days','hours','minutes'],decimal:false});
let draft=null,fmtDraft=null,timer;
const href=(path,text,classes='btn')=>`<a class="${classes}" href="#${path}">${text}</a>`;
const btn=(action,text,classes='btn')=>`<button class="${classes}" type="button" data-action="${action}">${text}</button>`;
const go=path=>{if(location.hash===`#${path}`)render();else location.hash=path};
const notify=message=>{clearTimeout(timer);$('toast').textContent=message;$('toast').hidden=false;timer=setTimeout(()=>{$('toast').hidden=true},3000)};
function confirmAction(title,body,label,action){const d=$('modal');d.innerHTML=`<form method="dialog"><h2 id="dialog-title">${esc(title)}</h2><p>${esc(body)}</p><div class="actions"><button class="btn" value="cancel" autofocus>Cancel</button><button class="btn danger" value="confirm">${esc(label)}</button></div></form>`;d.querySelector('form').onsubmit=e=>{e.preventDefault();d.close();if(e.submitter?.value==='confirm')action()};d.showModal()}
function advance(start,unit,count){const d=new Date(start);if(unit==='years'||unit==='months'){const day=d.getDate();d.setDate(1);if(unit==='years')d.setFullYear(d.getFullYear()+count);else d.setMonth(d.getMonth()+count);const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,max));return d}return new Date(+d+count*sizes[unit]*1000)}
function parts(target,fmt,now=new Date()){const end=new Date(target),chosen=fmt.units;let cursor=new Date(Math.min(+now,+end));return chosen.map((unit,index)=>{let count;
if(unit==='years'||unit==='months'){
count=unit==='years'?end.getFullYear()-cursor.getFullYear():(end.getFullYear()-cursor.getFullYear())*12+end.getMonth()-cursor.getMonth();
while(count>0&&advance(cursor,unit,count)>end)count--;
}else count=Math.floor((end-cursor)/(sizes[unit]*1000));
const next=advance(cursor,unit,count);
const value=fmt.decimal&&index===chosen.length-1?count+(end-next)/(advance(cursor,unit,count+1)-next):count;cursor=next;
return {value,unit:nf.format(value)==='1'?unit.slice(0,-1):unit}})}
const digitHTML=(target,fmt)=>parts(target,fmt).map(p=>`<div class="digit"><span class="number">${nf.format(p.value)}</span><span class="unit">${p.unit}</span></div>`).join('');
const remaining=(target,fmt,now)=>parts(target,fmt,now).map(p=>`${nf.format(p.value)} ${p.unit}`).join(', ')+' left';
const countdown=(target,fmt)=>`<div class="digits" data-target="${esc(target)}" data-format="${esc(JSON.stringify(fmt))}">${digitHTML(target,fmt)}</div>`;
const formatName=fmt=>fmt.units.join(' + ')+(fmt.decimal?' · 1 decimal':'');
const status=p=>`<span class="tag${tagDone(p)?' done':''}">${tagDone(p)?'Complete':'Counting'}</span>`;
const wrap=(html)=>`<div class="wrap">${html}</div>`;
const heading=(eyebrow,title,description='',action='')=>`<header class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${esc(title)}</h1>${description?`<p>${esc(description)}</p>`:''}</div>${action}</header>`;
const section=(title,action='')=>`<div class="section-title"><h2>${title}</h2>${action}</div>`;
const crumb=(path,label)=>href(path,`← ${esc(label)}`,'crumb');
const completionMessage='Time’s up. Countdown complete.';
function nextReminderContent(p,now=new Date()){
 const next=getNextCountdownReminder(p,now);
 if(!next){
  const explanation=new Date(p.target)<=now?'Countdown complete.':p.reminders.length&&!p.reminders.some(r=>r.enabled)?'All reminders are paused.':'No reminder scheduled before the target.';
  return `<strong class="next-label">Next reminder</strong><span>${explanation}</span>`;
 }
 const name=next.kind==='target'?'Time’s up':next.reminder.name;
 const message=next.kind==='target'?completionMessage:remaining(p.target,next.reminder.format,next.at);
 return `<strong class="next-label">Next reminder</strong><span><time datetime="${next.at.toISOString()}">${esc(targetFmt.format(next.at))}</time> · ${esc(name)}</span><span class="next-message"><strong>Will say:</strong> ${esc(message)}</span>`;
}
const nextReminderPanel=p=>`<div class="next-reminder" data-next-profile="${esc(p.id)}">${nextReminderContent(p)}</div>`;
function tile(p,hero=false){const reminders=p.reminders.filter(r=>r.enabled).length;const open=href(`profile/${p.id}`,hero?'Open profile →':'Open →',hero?'btn':'crumb');
return `<article class="${hero?'hero':'card'}"><div class="${hero?'hero-top':'card-top'}"><h2>${esc(p.name)}</h2>${status(p)}</div><p class="target">Target · ${esc(targetFmt.format(new Date(p.target)))}</p>${countdown(p.target,p.format)}<div class="${hero?'hero-bottom':'card-top'}">${open}<small>${reminders} enabled reminder${reminders===1?'':'s'}</small></div>${nextReminderPanel(p)}</article>`}
function profiles(){const active=state.profiles.filter(p=>!tagDone(p)),complete=state.profiles.filter(tagDone);
return wrap(heading('Profiles / Live','Your countdowns','Every profile counts down independently.',href('new',icon('plus')+' New profile','btn primary'))+
(!state.profiles.length?`<div class="panel empty"><h2>No countdowns yet</h2><p class="muted">Give a date and time something to count down to.</p>${href('new','Create a profile','btn primary')}</div>`:'')+
(active.length?tile(active[0],true):'')+(active.length>1?section(`Other countdowns (${active.length-1})`)+`<div class="grid">${active.slice(1).map(p=>tile(p)).join('')}</div>`:'')+
(complete.length?section(`Completed (${complete.length})`)+`<div class="grid">${complete.map(p=>tile(p)).join('')}</div>`:'')+
'<p class="foot">Interactive prototype · Changes stay in this browser · No real notifications</p>')}
function schedule(r){if(r.repeat==='once')return `Once · ${targetFmt.format(new Date(r.once))}`;const t=timeFmt.format(new Date(`2000-01-01T${r.time}`));return (r.repeat==='daily'?'Every day':r.repeat==='weekly'?`Every ${weekdays[+r.weekday]}`:`Monthly on day ${r.day}`)+` · ${t}`}
function profile(p){return wrap(crumb('profiles','All countdowns')+heading('Profile / Live',p.name,`Target: ${targetFmt.format(new Date(p.target))} · Local time`,href(`edit/${p.id}`,'Edit profile'))+
`<div class="hero"><div class="hero-top"><span class="eyebrow">Time remaining</span>${status(p)}</div>${countdown(p.target,p.format)}<div class="hero-bottom">${href(`format/${p.id}`,'Change display format')}<small>${esc(formatName(p.format))}</small></div></div>`+
nextReminderPanel(p)+section(`Reminders (${p.reminders.length})`,href(`reminder/${p.id}/new`,icon('plus')+' Add reminder','btn primary'))+
`<div class="panel">${p.reminders.length?p.reminders.map(r=>`<div class="row"><div class="row-main"><h3>${esc(r.name)}</h3><p>${esc(schedule(r))} · ${esc(formatName(r.format))}${r.enabled?'':' · Paused'}</p></div><div>${btn(`preview:${r.id}`,'Preview')}
${href(`reminder/${p.id}/${r.id}`,'Edit')}</div></div>`).join(''):'<div class="empty"><h2>No reminders yet</h2><p class="muted">Set a schedule and choose what each notification says.</p></div>'}</div>`+
`<div class="panel"><div class="row"><div><h3>Time’s up</h3><p>${p.notifyAtTarget?'On · Notifies at the target time.':'Off · No notification at the target time.'}</p></div><div>${p.notifyAtTarget?btn('preview-target','Preview'):''} ${href(`edit/${p.id}`,'Edit in profile')}</div></div></div>`+
(tagDone(p)?'<p class="foot">This countdown has ended. Its reminders won’t fire unless you move its target into the future.</p>':''))}
function profileForm(p){const path=p?`profile/${p.id}`:'profiles';return wrap(crumb(path,p?'Back to profile':'All countdowns')+heading('Profile / Setup',p?'Edit profile':'New profile','Choose what to count down to and when it ends.')+
`<form id="profile-form" class="panel"><div class="fields"><div class="field full"><label for="name">Profile name</label><input id="name" name="name" required maxlength="80" value="${esc(p?.name)}" placeholder="e.g. Night train to Kyoto"></div><div class="field"><label for="date">Target date</label><input id="date" type="date" name="date" required value="${esc(p?.target.split('T')[0])}"></div><div class="field"><label for="time">Target time</label><input id="time" type="time" name="time" required value="${esc(p?.target.split('T')[1]??'09:00')}"></div><small class="field full">Time is entered in your device’s local time zone.</small></div><label class="row choice spaced"><span><strong>Time’s up notification</strong><span class="hint">Send one notification when the target time arrives.</span></span><input id="notify-at-target" type="checkbox" name="notify-at-target"${p?.notifyAtTarget?' checked':''}></label><div class="actions">${p?btn('delete-profile','Delete profile','btn danger'):''}${href(path,'Cancel')}<button class="btn primary">${p?'Save changes':'Create profile'}</button></div></form>`)}
function reminderForm(p,r){const opt=(value,label)=>`<option value="${value}"${r.repeat===value?' selected':''}>${label}</option>`;return wrap(crumb(`profile/${p.id}`,'Back to profile')+heading('Reminder / Setup',r.id?'Edit reminder':'New reminder',`A reminder for ${p.name}.`)+
`<form id="reminder-form" class="panel"><div class="fields"><div class="field full"><label for="rem-name">Reminder name</label><input id="rem-name" name="name" maxlength="80" required placeholder="e.g. Morning check-in" value="${esc(r.name)}"></div><div class="field"><label for="repeat">Repeat</label><select id="repeat" name="repeat">${opt('daily','Daily')}${opt('weekly','Weekly')}${opt('monthly','Monthly')}${opt('once','Once')}</select></div><div id="time-field"><div class="field"><label for="rem-time">Time (local)</label><input id="rem-time" type="time" name="time" value="${esc(r.time)}" required></div></div><div id="weekday-field"><div class="field"><label for="weekday">Day of week</label><select id="weekday" name="weekday">${weekdays.map((day,i)=>`<option value="${i}"${+r.weekday===i?' selected':''}>${day}</option>`).join('')}</select></div></div><div id="day-field"><div class="field"><label for="day">Day of month</label><input id="day" type="number" name="day" min="1" max="31" value="${esc(r.day)}" required><small>Shorter months use their last day.</small></div></div><div id="once-field"><div class="field"><label for="once">Date and time (local)</label><input id="once" type="datetime-local" name="once" value="${esc(r.once)}" required></div></div></div>
<div class="row spaced"><div><h3>Notification format</h3><p>${esc(formatName(r.format))}</p></div>${btn('format-reminder','Change format')}</div><label class="row choice"><span><strong>Reminder enabled</strong><span class="hint">Pause this schedule without deleting it.</span></span><input type="checkbox" name="enabled"${r.enabled?' checked':''}></label>
<div class="actions">${r.id?btn('delete-reminder','Delete reminder','btn danger'):''}${btn('preview-draft','Preview')}${href(`profile/${p.id}`,'Cancel')}<button class="btn primary">Save reminder</button></div></form>`)}
function formatScreen(p,scope,fmt){const back=scope==='reminder'?`reminder/${p.id}/${draft.id||'new'}`:`profile/${p.id}`;return wrap(crumb(back,'Back')+heading('Format / Units',scope==='reminder'?'Notification format':'Display format','Choose any combination. Larger units appear first.')+
`<div class="panel"><h2>Units</h2><p class="muted">Pick one for a total, or several to show the remainder in smaller units.</p><div class="chips" role="group" aria-label="Countdown units">${units.map(u=>`<button class="chip" type="button" data-action="unit:${u}" aria-pressed="${fmt.units.includes(u)}">${u[0].toUpperCase()+u.slice(1)}</button>`).join('')}</div><label class="row choice spaced"><span><strong>Show a decimal</strong><span class="hint">Round the smallest selected unit to one decimal place.</span></span><input type="checkbox" id="decimal"${fmt.decimal?' checked':''}></label></div>
<div class="panel"><h2>Live preview</h2>${scope==='reminder'?`<div class="notification"><div class="eyebrow">Countdown to Death</div><h3>${esc(p.name)}</h3><p id="remaining-preview" data-target="${esc(p.target)}" data-format="${esc(JSON.stringify(fmt))}">${esc(tagDone(p)?'Countdown complete':remaining(p.target,fmt))}</p></div>`:countdown(p.target,fmt)}</div>
<div class="actions">${href(back,'Cancel')}${btn('save-format','Apply format','btn primary')}</div>`)}
function settings(){const desktop=state.platform!=='android';return wrap(heading('System / Preferences','Settings','Preview platform-specific behavior without changing this device.')+
`<div class="panel"><div class="row"><div><h3>Platform preview</h3><p>The same layout adapts to desktop and mobile widths.</p></div><select id="platform" aria-label="Platform preview" style="width:auto">${[['windows','Windows'],['linux','Linux'],['android','Android']].map(([k,v])=>`<option value="${k}"${state.platform===k?' selected':''}>${v}</option>`).join('')}</select></div></div>
<div class="panel"><h2>Background reminders</h2>${desktop?`<label class="row choice"><span><strong>Launch at login</strong><span class="hint">On by default. Can be disabled here.</span></span><input id="autorun" type="checkbox"${state.autorun?' checked':''}></label><div class="row"><div><h3>Closing the window</h3><p>Reminders stay active in the system tray. Use Quit to stop them.</p></div>${btn('tray-menu','Preview tray menu')}</div>`:`<div class="row"><div><h3>Android notifications</h3><p>Scheduled reminders can appear when the app isn’t open. Android may require permission.</p></div>${btn('android-permission','Preview permission')}</div>`}</div>
<div class="panel"><div class="row"><div><h3>Prototype data</h3><p>Restore the example countdowns and settings in this browser.</p></div>${btn('reset','Reset demo','btn danger')}</div></div>`)}
function demoDialog(title,body){const d=$('modal');d.innerHTML=`<form method="dialog"><h2 id="dialog-title">${title}</h2>${body}<div class="actions"><button class="btn" autofocus>Close</button></div></form>`;d.showModal()}
function preview(p,r){
 const now=new Date(),next=r&&getNextCountdownReminder({...p,notifyAtTarget:false,reminders:[r]},now);
 const message=!r?completionMessage:tagDone(p)?'Countdown complete':remaining(p.target,r.format,next?.at??now);
 const timing=!r?`Target · ${targetFmt.format(new Date(p.target))}`:next?`Scheduled for ${targetFmt.format(next.at)}`:r.enabled?'No upcoming occurrence. Example uses time left now.':'Paused. Example uses time left now.';
 demoDialog('Notification preview',`<div class="notification"><div class="eyebrow">Countdown to Death</div><h3>${esc(p.name)}</h3><p>${esc(message)}</p></div><p>${esc(r?`${r.name||'Untitled reminder'} · ${schedule(r)}`:'Time’s up')}</p><p>${esc(timing)}</p>`);
}
function render(){
const [screen='profiles',id,sub]=location.hash.slice(1).split('/').filter(Boolean);const p=state.profiles.find(x=>x.id===id);
$('nav').innerHTML=`<a href="#profiles"${screen!=='settings'?' aria-current="true"':''}>${icon('grid')} Profiles</a><a href="#settings"${screen==='settings'?' aria-current="page"':''}>${icon('settings')} Settings</a>`;
setTheme(state.theme);
let html;
if(screen==='settings')html=settings();else if(screen==='new')html=profileForm();else if(p&&screen==='profile')html=profile(p);else if(p&&screen==='edit')html=profileForm(p);else if(p&&screen==='reminder'){
 const saved=p.reminders.find(x=>x.id===sub);if(!saved&&sub!=='new'){go(`profile/${id}`);return}
 if(!draft||draft.profileId!==id||(draft.id||'new')!==sub)draft={...(saved?structuredClone(saved):{id:'',name:'',repeat:'daily',time:'09:00',weekday:'1',day:'1',once:future(1,9),enabled:true,format:{units:['days'],decimal:false}}),profileId:id};
 html=reminderForm(p,draft);
}else if(p&&screen==='format'){
 if(sub==='reminder'&&(!draft||draft.profileId!==id)){go(`profile/${id}`);return}
 const token=`${id}/${sub||'display'}`;if(!fmtDraft||fmtDraft.token!==token)fmtDraft={token,format:structuredClone(sub==='reminder'?draft.format:p.format)};
 html=formatScreen(p,sub,fmtDraft.format);
}else html=profiles();
if(screen!=='format')fmtDraft=null;
if(!(screen==='reminder'||(screen==='format'&&sub==='reminder')))draft=null;
$('app').innerHTML=html;
const pf=$('profile-form');if(pf)pf.onsubmit=e=>{e.preventDefault();const f=new FormData(pf),name=f.get('name').trim();if(!name){notify('Enter a profile name.');return}const target=`${f.get('date')}T${f.get('time')}`,notifyAtTarget=f.has('notify-at-target');if(p){p.name=name;p.target=target;p.notifyAtTarget=notifyAtTarget;persist();go(`profile/${p.id}`)}else{const item={id:uid(),name,target,notifyAtTarget,format:baseFormat(),reminders:[]};state.profiles.unshift(item);persist();go(`profile/${item.id}`)}notify('Profile saved')};
const rf=$('reminder-form');
const readDraft=()=>{if(!rf)return;for(const field of ['name','repeat','time','weekday','day','once'])draft[field]=rf.elements.namedItem(field).value;draft.enabled=rf.elements.namedItem('enabled').checked};
if(rf){const update=()=>{const repeat=$('repeat').value;for(const [field,active] of Object.entries({time:repeat!=='once',weekday:repeat==='weekly',day:repeat==='monthly',once:repeat==='once'})){const el=$(`${field}-field`);el.hidden=!active;el.querySelector('input,select').disabled=!active}};update();rf.oninput=()=>{readDraft();update()};rf.onsubmit=e=>{e.preventDefault();readDraft();if(!draft.name.trim()){notify('Enter a reminder name.');return}if(draft.repeat==='once'&&new Date(draft.once)>=new Date(p.target)){notify('Schedule the reminder before the target.');return}const {profileId,...r}=draft;r.name=r.name.trim();const at=p.reminders.findIndex(x=>x.id===r.id);if(at<0){r.id=uid();p.reminders.push(r)}else p.reminders[at]=r;draft=null;persist();go(`profile/${p.id}`);notify('Reminder saved')}}
if($('decimal'))$('decimal').onchange=e=>{fmtDraft.format.decimal=e.target.checked;render();$('decimal')?.focus()};
if($('autorun'))$('autorun').onchange=e=>{state.autorun=e.target.checked;persist();notify(state.autorun?'Launch at login enabled':'Launch at login disabled')};
if($('platform'))$('platform').onchange=e=>{state.platform=e.target.value;persist();render();$('platform')?.focus()};
$('app').onclick=e=>{const button=e.target.closest('[data-action]');if(!button)return;const [action,value]=button.dataset.action.split(':');switch(action){
case 'delete-profile':confirmAction('Delete this profile?','The countdown and all of its reminders will be removed.','Delete profile',()=>{state.profiles=state.profiles.filter(x=>x!==p);persist();go('profiles');notify('Profile deleted')});break;
case 'delete-reminder':confirmAction('Delete this reminder?','The profile and its other reminders won’t change.','Delete reminder',()=>{p.reminders=p.reminders.filter(x=>x.id!==draft.id);draft=null;persist();go(`profile/${p.id}`);notify('Reminder deleted')});break;
case 'format-reminder':readDraft();go(`format/${p.id}/reminder`);break;
case 'preview':{const r=p.reminders.find(x=>x.id===value);if(r)preview(p,r);break}
case 'preview-target':preview(p,null);break;
case 'preview-draft':readDraft();if(rf.reportValidity())preview(p,draft);break;
case 'unit':{const set=new Set(fmtDraft.format.units);if(set.has(value)&&set.size===1){notify('Keep at least one unit selected.');break}if(set.has(value))set.delete(value);else set.add(value);fmtDraft.format.units=units.filter(u=>set.has(u));render();$('app').querySelector(`[data-action="unit:${value}"]`)?.focus();break}
case 'save-format':if(sub==='reminder'){draft.format=fmtDraft.format;go(`reminder/${p.id}/${draft.id||'new'}`);notify('Format applied to this draft')}else{p.format=fmtDraft.format;persist();go(`profile/${p.id}`);notify('Display format saved')}break;
case 'tray-menu':demoDialog('System tray menu','<div class="notification"><strong>Countdown to Death</strong><p>Open countdowns</p><p>Settings</p><p>Quit · stops desktop reminders</p></div><p>This is a visual preview, not a real tray menu.</p>');break;
case 'android-permission':demoDialog('Allow notifications?','<p>The installed Android app would request permission to show reminders. The prototype does not request access.</p>');break;
case 'reset':confirmAction('Reset the prototype?','Your edits will be replaced with the example countdowns.','Reset demo',()=>{state=fresh();persist();go('profiles');notify('Demo restored')});break;
}};
}
themePanel.onclick=e=>{const b=e.target.closest('button');if(b){setTheme(b.dataset.theme);persist()}};
addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
setInterval(()=>{const now=new Date();document.querySelectorAll('[data-next-profile]').forEach(el=>{const profile=state.profiles.find(p=>p.id===el.dataset.nextProfile);if(profile){const html=nextReminderContent(profile,now);if(el.dataset.renderedNext!==html){el.dataset.renderedNext=html;el.innerHTML=html}}});document.querySelectorAll('.digits[data-target]').forEach(el=>{const html=digitHTML(el.dataset.target,JSON.parse(el.dataset.format));if(el.innerHTML!==html)el.innerHTML=html});const p=$('remaining-preview');if(p){const text=new Date(p.dataset.target)<=new Date()?'Countdown complete':remaining(p.dataset.target,JSON.parse(p.dataset.format));if(p.textContent!==text)p.textContent=text}},1000);
</script>
</body>
