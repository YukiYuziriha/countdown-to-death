name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a release APK signed with the repository's Android signing secrets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify shared assets and test scheduling
        run: python ../scripts/half-cpu.py gradle --no-daemon :app:verifyHostedAssets :app:testDebugUnitTest :app:lintDebug
      - name: Build and verify debug APK
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_release
        run: |
          python ../scripts/half-cpu.py gradle --no-daemon :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Build and verify signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          ANDROID_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/countdown-signing.XXXXXXXX.jks")"
          export ANDROID_KEYSTORE_PATH
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          python ../scripts/half-cpu.py gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_release
        with:
          name: countdown-to-death-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release
        with:
          name: countdown-to-death-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
